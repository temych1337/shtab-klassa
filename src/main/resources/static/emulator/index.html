<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Штаб класса — эмулятор чата</title>
<style>
  :root {
    --bg: #eef1f5; --pane: #ffffff; --line: #dde2ea; --text: #1d232b; --muted: #6b7684;
    --bot: #f1f3f7; --mine: #1f5fd6; --mine-text: #ffffff;
    --btn: #e7eefc; --btn-text: #1f5fd6; --positive: #e3f5e8; --positive-text: #1d7a3b;
    --negative: #fbe7e7; --negative-text: #b3261e; --accent: #1f5fd6; --chip: #eef3fe;
    --toast: #1d232b; --toast-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --pane: #1a2029; --line: #2a323e; --text: #e6e9ee; --muted: #8b95a3;
      --bot: #232b36; --mine: #2f6fe0; --mine-text: #ffffff;
      --btn: #243552; --btn-text: #9cc0ff; --positive: #1f3a2a; --positive-text: #8fdca8;
      --negative: #3d2224; --negative-text: #ff9f98; --accent: #6ea3ff; --chip: #243049;
      --toast: #e6e9ee; --toast-text: #12161c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 12px 16px 10px; }
  header h1 { font-size: 17px; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px; height: calc(100vh - 66px); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; height: auto; } .pane { height: 85vh; } }
  .pane { background: var(--pane); border: 1px solid var(--line); border-radius: 14px;
          display: flex; flex-direction: column; min-height: 0; position: relative; overflow: hidden; }
  .pane-head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .role { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--chip); color: var(--accent);
          white-space: nowrap; }
  .pane-head select { flex: 1; min-width: 0; font: inherit; padding: 6px 8px; border-radius: 8px;
                      border: 1px solid var(--line); background: var(--pane); color: var(--text); }
  .messages { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--muted); text-align: center; margin: auto; font-size: 14px; }
  .row { display: flex; flex-direction: column; align-items: flex-start; }
  .row.mine { align-items: flex-end; }
  .msg { background: var(--bot); border-radius: 14px 14px 14px 4px; padding: 9px 12px; max-width: 88%;
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .mine .msg { background: var(--mine); color: var(--mine-text); border-radius: 14px 14px 4px 14px; }
  .time { font-size: 11px; color: var(--muted); margin: 2px 6px 0; }
  .file { display: inline-block; margin-top: 6px; color: var(--accent); font-weight: 600; text-decoration: none; }
  .kb { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .kb-row { display: flex; gap: 6px; }
  .kb button, .menu button { flex: 1; border: 0; border-radius: 9px; padding: 8px 10px; font: inherit;
         font-size: 14px; cursor: pointer; background: var(--btn); color: var(--btn-text); }
  .kb button.POSITIVE { background: var(--positive); color: var(--positive-text); }
  .kb button.NEGATIVE { background: var(--negative); color: var(--negative-text); }
  .kb button:active, .menu button:active { transform: scale(0.98); }
  .menu { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 0; border-top: 1px solid var(--line); }
  .menu:empty { display: none; }
  form { display: flex; gap: 8px; padding: 10px 12px; }
  form input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 9px;
               border: 1px solid var(--line); background: var(--pane); color: var(--text); }
  form button { font: inherit; border: 0; border-radius: 9px; padding: 8px 14px; background: var(--accent);
                color: #fff; cursor: pointer; }
  .toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--toast);
           color: var(--toast-text); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0;
           transition: opacity .15s; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Штаб класса</h1>
  <p>Эмулятор мессенджера для показа без MAX. Слева и справа — два человека из класса; всё, что жмёте, уходит в того же бота.</p>
</header>
<main>
  <section class="pane"></section>
  <section class="pane"></section>
</main>
<template id="pane">
  <div class="pane-head"><span class="role"></span><select aria-label="Чей чат"></select></div>
  <div class="messages"></div>
  <div class="menu"></div>
  <form><input placeholder="Сообщение" autocomplete="off" aria-label="Сообщение"><button aria-label="Отправить">➤</button></form>
  <div class="toast" role="status"></div>
</template>
<script>
const api = '/api/emulator';
let people = [];
const panes = [...document.querySelectorAll('.pane')].map(root => {
  root.append(document.getElementById('pane').content.cloneNode(true));
  return { root, peer: null, revision: -1, count: 0,
           role: root.querySelector('.role'), select: root.querySelector('select'),
           messages: root.querySelector('.messages'), menu: root.querySelector('.menu'),
           input: root.querySelector('input'), toast: root.querySelector('.toast') };
});

async function json(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) throw new Error(response.status + ' ' + url);
  return response.status === 204 ? null : response.json();
}

function post(url, body) {
  return json(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                     body: body === undefined ? undefined : JSON.stringify(body) });
}

const chatUrl = pane => `${api}/chats/${encodeURIComponent(pane.peer)}`;

async function open(pane, peer) {
  pane.peer = peer;
  pane.revision = -1;
  pane.count = 0;
  const person = people.find(p => p.id === peer);
  pane.role.textContent = person && person.role === 'TEACHER' ? 'Учитель' : 'Родитель';
  await post(`${chatUrl(pane)}/start`); // как "Начать" в MAX: первый раз бот поздоровается и даст меню
  await refresh(pane);
}

async function loadPeople() {
  people = await json(`${api}/people`);
  // страницу открыли пока seed.reset ещё сеет - список пустой, подождём
  for (let tries = 0; !people.some(p => p.role === 'TEACHER') && tries < 30; tries++) {
    await new Promise(done => setTimeout(done, 1000));
    people = await json(`${api}/people`);
  }
  const teacher = people.find(p => p.role === 'TEACHER');
  const parent = people.find(p => p.role === 'PARENT');
  for (const [index, pane] of panes.entries()) {
    for (const person of people) pane.select.add(new Option(person.name, person.id));
    const preferred = (index === 0 ? teacher : parent) || people[0];
    pane.select.value = preferred ? preferred.id : '';
    pane.select.onchange = () => open(pane, pane.select.value);
    if (preferred) await open(pane, preferred.id);
  }
}

function button(label, color, onClick) {
  const element = document.createElement('button');
  element.type = 'button';
  element.textContent = label;
  if (color) element.className = color;
  element.onclick = onClick;
  return element;
}

const clock = new Intl.DateTimeFormat('ru', { hour: '2-digit', minute: '2-digit' });

function render(pane, messages) {
  const atBottom = pane.messages.scrollHeight - pane.messages.scrollTop - pane.messages.clientHeight < 40;
  pane.messages.innerHTML = '';
  pane.menu.innerHTML = '';
  if (messages.length === 0) {
    pane.messages.innerHTML = '<div class="empty">Пока пусто.</div>';
  }
  let menu = null;
  for (const message of messages) {
    const row = document.createElement('div');
    row.className = message.mine ? 'row mine' : 'row';
    const bubble = document.createElement('div');
    bubble.className = 'msg';
    bubble.textContent = message.text || '';
    if (message.fileId) {
      const link = document.createElement('a');
      link.className = 'file';
      link.href = `${api}/files/${message.fileId}`;
      link.textContent = `📎 ${message.fileName}`;
      bubble.append(document.createElement('br'), link);
    }
    if (message.keyboard && message.keyboard.inline) {
      const keyboard = document.createElement('div');
      keyboard.className = 'kb';
      for (const keys of message.keyboard.rows) {
        const line = document.createElement('div');
        line.className = 'kb-row';
        for (const key of keys) {
          line.append(button(key.label, key.color, () => key.callback
            ? press(pane, message.id, key.payload) : send(pane, key.label)));
        }
        keyboard.append(line);
      }
      bubble.append(keyboard);
    } else if (message.keyboard) {
      menu = message.keyboard; // постоянное меню внизу - последнее присланное
    }
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = clock.format(new Date(message.sentAt));
    row.append(bubble, time);
    pane.messages.append(row);
  }
  if (menu) {
    for (const key of menu.rows.flat()) pane.menu.append(button(key.label, null, () => send(pane, key.label)));
  }
  if (atBottom || messages.length > pane.count) pane.messages.scrollTop = pane.messages.scrollHeight;
  pane.count = messages.length;
}

async function refresh(pane) {
  if (!pane.peer) return;
  const chat = await json(chatUrl(pane));
  if (chat.revision === pane.revision) return;
  pane.revision = chat.revision;
  render(pane, chat.messages);
}

function toast(pane, text) {
  if (!text) return;
  pane.toast.textContent = text;
  pane.toast.classList.add('show');
  clearTimeout(pane.toastTimer);
  pane.toastTimer = setTimeout(() => pane.toast.classList.remove('show'), 2200);
}

// без catch упавший запрос выглядит на показе как "кнопка не нажимается"
async function press(pane, messageId, payload) {
  try {
    const answer = await post(`${chatUrl(pane)}/press`, { messageId, payload });
    toast(pane, answer.notification);
  } catch (error) {
    toast(pane, 'Сервер не ответил, подробности в логе');
  }
  refreshAll();
}

async function send(pane, text) {
  try {
    await post(`${chatUrl(pane)}/messages`, { text });
  } catch (error) {
    toast(pane, 'Сервер не ответил, подробности в логе');
  }
  refreshAll();
}

function refreshAll() {
  panes.forEach(pane => refresh(pane).catch(() => {}));
}

for (const pane of panes) {
  pane.root.querySelector('form').onsubmit = event => {
    event.preventDefault();
    const text = pane.input.value.trim();
    if (!text) return;
    pane.input.value = '';
    send(pane, text);
  };
}

loadPeople().then(() => setInterval(refreshAll, 700))
  .catch(() => document.querySelector('main').innerHTML =
    '<p style="padding:16px">Эмулятор выключен. Запуск: <code>--spring.profiles.active=seed,emulator</code></p>');
</script>
</body>
</html>
